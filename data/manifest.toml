# ملف المرجعية المعتمدة (ADR-0010)
# يحدد المصادر المفعّلة، وأدوارها، وإصداراتها، وتراخيصها. وكل تقرير يحمل معرّفه وبصمته.
# تغيير الدور هنا يغيّر ما يجوز للمصدر أن يقرره، دون أي تعديل في الكود.
