# تغيير الدور هنا يغيّر ما يجوز للمصدر أن يقرره، دون أي تعديل في الكود.
#
# الأدوار: REFERENCE_TEXT (نص معتمد) · AUTHENTIC (مصدر احتجاج) · RULING (حكم منقول)
#          LOCATE (مصدر موضع، دون حكم) · LINK (رابط فقط)

